[project]
name = "cama"
version = "0.1.0"
description = "Cache-Aware Memory Architecture for agents (private research code)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
cama = "cama.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
