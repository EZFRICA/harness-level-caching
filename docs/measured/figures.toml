[[figure]]
id = "cluster-scale"
kind = "load"
file = "stress-scale.md"
title = "Agents per worker (S3) and workers (S6), before and after admission control"
question = "How many agents can one worker carry, what happens past that point, and what do more workers give?"
runs = ["cluster-s3-1w-1a-v1", "cluster-s3-1w-4a-v1", "cluster-s3-1w-16a-v1", "cluster-s3-1w-1a-v2", "cluster-s3-1w-4a-v2", "cluster-s3-1w-16a-v2", "cluster-s3-1w-32a-v2", "cluster-s6-1w-18a-v2", "cluster-s6-2w-18a-v2", "cluster-s6-3w-18a-v2"]
columns = ["run", "workers", "agents", "ok", "rps", "p50", "p95", "p99"]
reproduce = "./scripts/stress_scale.sh (fresh cluster per run, echo model with the fitted latency model, 12 turns per agent)"
reading = [
  "v1, without admission control: sixteen agents on one worker answered nothing (0 of 192). The worker never crashed; concurrent model inference starved its event loop and it stopped accepting connections.",
  "v2, with one inference at a time, bounded agent opening and a fast busy answer: sixteen agents get 190 of 192 answers at 3.0 requests per second, thirty two agents 356 of 384 at 4.2.",
  "The answers still missing come mostly from the first turn: many agents opening at once on one worker queue longer than the client's retries. A cold start limit, not a steady state one.",
  "A second worker nearly doubles throughput for eighteen agents and halves the tail; the third adds little because eighteen agents cannot send more than about nine requests per second.",
]
limits = [
  "Echo model with a latency model fitted on real calls; one run per point; all containers on one machine.",
  "The v1 series stopped at sixteen agents: its next runs would have been built from changed code.",
]

[[figure]]
id = "agentic-nebius-implicit"
file = "nebius.md"
title = "Agentic turns on an implicit-only provider (Nebius serverless, DeepSeek-V4-Flash-0731)"
question = "When the provider caches prefixes on its own and offers no cache object, does keeping the whole active set in a stable order earn more cached tokens than per-query selection, and what does it cost?"
runs = ["nebius-dsv4flash-onnx-agentic-cama-v1", "nebius-dsv4flash-onnx-agentic-cama-v2", "nebius-dsv4flash-onnx-agentic-cama-v3", "nebius-dsv4flash-onnx-agentic-topk-v1", "nebius-dsv4flash-onnx-agentic-topk-v2", "nebius-dsv4flash-onnx-agentic-topk-v3", "nebius-dsv4flash-onnx-agentic-naive-v1", "nebius-dsv4flash-onnx-agentic-naive-v2", "nebius-dsv4flash-onnx-agentic-naive-v3", "nebius-dsv4flash-onnx-agentic-noh3-v1"]
columns = ["run", "mode", "cache_mode", "hot", "model_calls", "prompt", "cached_share", "h3", "cost", "cost_cold"]
reproduce = "CAMA_EMBEDDER=onnx docker compose up -d && docker compose exec -T -e CAMA_LLM=openai_compat -e CAMA_MODEL=deepseek-ai/DeepSeek-V4-Flash-0731 -e CAMA_OAI_BASE_URL=https://api.tokenfactory.nebius.com/v1 -e CAMA_OAI_KEY_ENV=NEBIUS_API_KEY -e CAMA_OAI_SALT=<run id> [-e CAMA_TOOL_CACHE=off] cama cama run /scenarios/agentic_fr_v1.jsonl --fresh --mode <cama|topk|naive> --run-id <run id>"
reading = [
  "cama, which renders the whole active set in a stable order, had 75.0% to 78.5% of its prompt tokens served from the provider cache; topk, which selects blocks per query, had 55.2% to 62.7%, on three replicates each.",
  "cama also sent more prompt tokens (about 77k against 50k to 54k), so its hot path cost is close to topk's: the higher cached share pays for the larger prompt, it does not make the run cheaper.",
  "naive is the cheapest arm by a factor of about four because it has no cold path: memory extraction is more than half of cama's and topk's bill, as on Gemini.",
  "naive also called fewer tools and answered faster; nothing here shows its answers were as good.",
  "Switching H3 off (one run) left the cost inside the spread of the cama replicates.",
]
limits = [
  "Three replicates per mode, one for noh3; 24 turns of one synthetic French scenario with simulated tools; latency stats skip the first turn.",
  "Provider caching is best effort and its cache is shared between customers of a model: each run opens its system prompt with its own salt (its run id), so hits come from the run itself.",
  "There is no ablation of the stable order itself: with an implicit-only provider CAMA_PREFIX_CACHE=none changes the label, not the request.",
  "Prices official, read from the provider's model listing; these figures hold for this provider only, not for Gemini or a self-hosted server.",
  "Answer quality is not measured.",
]

