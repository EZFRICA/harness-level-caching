[[figure]]
id = "agentic-cost-g35lite"
file = "agentic.md"
title = "Agentic turns on gemini-3.5-flash-lite: cost, latency and the mechanism behind each"
question = "Over 24 tool-using turns, what does each harness cache change in money and in waiting time, against its ablation and the baselines?"
runs = ["g35lite-onnx-agentic-cama-v1", "g35lite-onnx-agentic-cama-v2", "g35lite-onnx-agentic-cama-v3", "g35lite-onnx-agentic-nopc-v1", "g35lite-onnx-agentic-noh3-v1", "g35lite-onnx-agentic-topk-v1", "g35lite-onnx-agentic-naive-v1"]
columns = ["run", "mode", "cache_mode", "hot", "model_calls", "cached_share", "h3", "cost", "cost_cold"]
reproduce = "HC_LLM=gemini HC_EMBEDDER=onnx docker compose up -d && docker compose exec -T [-e HC_PREFIX_CACHE=none | -e HC_TOOL_CACHE=off] hc harness-cache run /scenarios/agentic_fr_v1.jsonl --fresh --mode <extract|topk|naive>"
reading = [
  "The explicit prefix cache cuts the hot path cost by about 60% against its ablation (nopc), and every agentic step reuses it.",
  "It also makes turns slower: the extract replicates sit around 2.4 to 2.7 s against 1.8 s without the cache, with confidence intervals apart. Explicit cached requests are slower on this provider.",
  "The cold path dominates the extract arm's bill: memory extraction costs more than the prefix cache saves, so naive, which has no cold path, is the cheapest arm over 24 turns.",
  "The tool cache served 7 of 23 tool calls and removed about 200 ms of tool time per turn at the median; its effect on turn latency is inside the model's variance.",
  "The extract arm v2 and v3 were launched as ablations but the flag never reached the container; their manifests say so and they are kept as replicates.",
]
limits = [
  "24 turns, one synthetic French scenario, simulated tools; latency stats skip the first turn.",
  "Prices: official for input, output, cache read and storage; cache creation priced as input is an assumption.",
  "Answer quality is not measured, so a cheaper arm is not shown to be as good.",
]

