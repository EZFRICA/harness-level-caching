  "Echo model with a latency model fitted on real calls; one run per point; all containers on one machine.",
  "The v1 series stopped at sixteen agents: its next runs would have been built from changed code.",
]

[[figure]]
id = "agentic-nebius-implicit"
file = "nebius.md"
title = "Agentic turns on an implicit-only provider (Nebius serverless, DeepSeek-V4-Flash-0731)"
question = "When the provider caches prefixes on its own and offers no cache object, does keeping the whole active set in a stable order earn more cached tokens than per-query selection, and what does it cost?"
runs = ["nebius-dsv4flash-onnx-agentic-cama-v1", "nebius-dsv4flash-onnx-agentic-cama-v2", "nebius-dsv4flash-onnx-agentic-cama-v3", "nebius-dsv4flash-onnx-agentic-topk-v1", "nebius-dsv4flash-onnx-agentic-topk-v2", "nebius-dsv4flash-onnx-agentic-topk-v3", "nebius-dsv4flash-onnx-agentic-naive-v1", "nebius-dsv4flash-onnx-agentic-naive-v2", "nebius-dsv4flash-onnx-agentic-naive-v3", "nebius-dsv4flash-onnx-agentic-noh3-v1"]
columns = ["run", "mode", "cache_mode", "hot", "model_calls", "prompt", "cached_share", "h3", "cost", "cost_cold"]
reproduce = "HC_EMBEDDER=onnx docker compose up -d && docker compose exec -T -e HC_LLM=openai_compat -e HC_MODEL=deepseek-ai/DeepSeek-V4-Flash-0731 -e HC_OAI_BASE_URL=https://api.tokenfactory.nebius.com/v1 -e HC_OAI_KEY_ENV=NEBIUS_API_KEY -e HC_OAI_SALT=<run id> [-e HC_TOOL_CACHE=off] hc harness-cache run /scenarios/agentic_fr_v1.jsonl --fresh --mode <extract|topk|naive> --run-id <run id>"
reading = [
  "The extract arm, which renders the whole active set in a stable order, had 75.0% to 78.5% of its prompt tokens served from the provider cache; topk, which selects blocks per query, had 55.2% to 62.7%, on three replicates each.",
  "The extract arm also sent more prompt tokens (about 77k against 50k to 54k), so its hot path cost is close to topk's: the higher cached share pays for the larger prompt, it does not make the run cheaper.",
  "naive is the cheapest arm by a factor of about four because it has no cold path: memory extraction is more than half of the extract arm's and topk's bill, as on Gemini.",
  "naive also called fewer tools and answered faster; nothing here shows its answers were as good.",
  "Switching H3 off (one run) left the cost inside the spread of the extract replicates.",
]
limits = [
  "Three replicates per mode, one for noh3; 24 turns of one synthetic French scenario with simulated tools; latency stats skip the first turn.",
  "Provider caching is best effort and its cache is shared between customers of a model: each run opens its system prompt with its own salt (its run id), so hits come from the run itself.",
  "There is no ablation of the stable order itself: with an implicit-only provider HC_PREFIX_CACHE=none changes the label, not the request.",
  "Prices official, read from the provider's model listing; these figures hold for this provider only, not for Gemini or a self-hosted server.",
  "Answer quality is not measured.",
]

