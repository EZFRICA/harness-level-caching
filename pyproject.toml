[project]
name = "harness-cache"
version = "0.1.0"
description = "Harness-Level Caching for LLM Agents (private research code)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "google-genai>=1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
local = ["fastembed>=0.8.0,<0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100", "mutmut>=3.2"]

[project.scripts]
harness-cache = "harness_cache.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_cache = ["dash/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = ["src/harness_cache/memory/active_set.py", "src/harness_cache/memory/prefix_cache.py", "src/harness_cache/trace/ledger.py",
                   "src/harness_cache/teu/cache.py", "src/harness_cache/cost.py", "src/harness_cache/cluster/coordinator.py"]
tests_dir = ["tests/"]
also_copy = ["src/harness_cache/", "scenarios/", "docs/", ".claude/", "CLAUDE.md", "README.md", "pricing.toml"]
