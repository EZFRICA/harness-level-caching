# Online profile on a constrained container.
#   docker compose up -d --build
#   docker compose exec -it hc harness-cache chat
#   docker compose exec hc harness-cache run /scenarios/assistant_fr_v1.jsonl --fresh
name: harness-cache

services:
  hc:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        HC_CODE_SHA: ${HC_CODE_SHA:-unknown}
    image: harness-cache:dev
    container_name: hc-online
    # Main process = live dashboard (http://hc.harness-cache.orb.local); experiments run with `docker compose exec`.
    command: ["harness-cache", "dashboard", "--host", "0.0.0.0", "--port", "8797"]
    labels:
      dev.orbstack.http-port: "8797"
    ports:
      - "127.0.0.1:8797:8797"        # http://localhost:8797
    env_file:
      - path: .env          # GEMINI_API_KEY (never committed)
        required: false
    environment:
      HC_LLM: ${HC_LLM:-echo}
      HC_EMBEDDER: ${HC_EMBEDDER:-hash}
      HC_MODEL: ${HC_MODEL:-gemini-3.5-flash-lite}
      HC_MODE: ${HC_MODE:-extract}
      HC_ONLINE: "1"
      HC_PRICING: /config/pricing.toml
      HC_MAX_USD: ${HC_MAX_USD:-2}
      HC_COORDINATOR: postgresql://hc:hc-local@postgres:5432/hc   # read by the dashboard in cluster mode
      HC_MEASURED_DIR: /docs/measured
      HC_LEDGER: /docs/ledger.jsonl
      HC_LOG_LEVEL: ${HC_LOG_LEVEL:-INFO}
    # "Modest device" limits. Change them per experiment; they are recorded in each run manifest.
    cpus: ${HC_CPUS:-1.0}
    mem_limit: ${HC_MEM:-1g}
    memswap_limit: ${HC_MEM:-1g}   # equal to mem_limit: no swap
    pids_limit: 128
    volumes:
      - hc-data:/data              # L3 store + journal (SQLite), persists across restarts
      - hc-archive:/archive        # L4 replica, fed by the cold path
      - ./runs:/runs                 # metrics and logs, readable from the host
      - ./scenarios:/scenarios:ro    # scripted conversations
      - ./models:/models:ro          # local ONNX embedding model (never downloaded at runtime)
      - ./pricing.toml:/config/pricing.toml:ro   # prices and cache capabilities, with provenance
      - ./docs:/docs:ro              # frozen runs and the ledger, read by the dashboard

  # ── cluster profile: docker compose --profile cluster up -d ─────────────────────────────
  postgres:
    profiles: [cluster]
    image: postgres:17-alpine
    container_name: hc-postgres
    environment:
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: hc-local      # local test credential, the port is not published
      POSTGRES_DB: hc
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hc"]
      interval: 2s
      timeout: 2s
      retries: 30

  hc-w1: &worker
    profiles: [cluster]
    image: harness-cache:dev
    container_name: hc-w1
    command: ["harness-cache", "serve", "--worker", "w1"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &worker-env
      HC_LLM: ${HC_LLM:-echo}
      HC_EMBEDDER: ${HC_EMBEDDER:-onnx}
      HC_MODEL: ${HC_MODEL:-gemini-3.5-flash-lite}
      HC_PRICING: /config/pricing.toml
      HC_MAX_USD: ${HC_MAX_USD:-2}
      HC_COORDINATOR: postgresql://hc:hc-local@postgres:5432/hc
      HC_CLUSTER_RUN: ${HC_CLUSTER_RUN:-cluster}
      HC_TOOL_LATENCY_SCALE: ${HC_TOOL_LATENCY_SCALE:-1}
      HC_ECHO_BASE_MS: ${HC_ECHO_BASE_MS:-1000}
      HC_ECHO_MS_PER_OUTPUT_TOKEN: ${HC_ECHO_MS_PER_OUTPUT_TOKEN:-3}
      HC_ECHO_CACHED_EXTRA_MS: ${HC_ECHO_CACHED_EXTRA_MS:-100}
      HC_FAULT_LLM_ERROR_RATE: ${HC_FAULT_LLM_ERROR_RATE:-0}
      HC_FAULT_TOOL_ERROR_RATE: ${HC_FAULT_TOOL_ERROR_RATE:-0}
      HC_LOG_LEVEL: WARNING
    env_file:
      - path: .env
        required: false
    cpus: ${HC_CPUS:-1.0}
    mem_limit: ${HC_MEM:-1g}
    memswap_limit: ${HC_MEM:-1g}
    volumes:
      - w1-data:/data
      - ./runs:/runs
      - ./scenarios:/scenarios:ro
      - ./models:/models:ro
      - ./pricing.toml:/config/pricing.toml:ro

  hc-w2:
    <<: *worker
    container_name: hc-w2
    command: ["harness-cache", "serve", "--worker", "w2"]
    volumes:
      - w2-data:/data
      - ./runs:/runs
      - ./scenarios:/scenarios:ro
      - ./models:/models:ro
      - ./pricing.toml:/config/pricing.toml:ro

  hc-w3:
    <<: *worker
    container_name: hc-w3
    command: ["harness-cache", "serve", "--worker", "w3"]
    volumes:
      - w3-data:/data
      - ./runs:/runs
      - ./scenarios:/scenarios:ro
      - ./models:/models:ro
      - ./pricing.toml:/config/pricing.toml:ro

volumes:
  hc-data:
  hc-archive:
  pg-data:
  w1-data:
  w2-data:
  w3-data:
