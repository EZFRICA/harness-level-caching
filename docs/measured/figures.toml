[[figure]]
id = "memory-recall-hypotheses"
file = "recall.md"
title = "Recall of planted facts against cost: baselines and two cache hypotheses (Nebius)"
question = "Over 32 turns that plant 9 facts (one corrected) and then ask for them back, how many facts does each arm recall, and what do the window epoch (H1) and extraction every two turns (H2) change in cost?"
runs = ["nebius-dsv4flash-onnx-memory-naive-v1", "nebius-dsv4flash-onnx-memory-naive-v2", "nebius-dsv4flash-onnx-memory-topk-v1", "nebius-dsv4flash-onnx-memory-topk-v2", "nebius-dsv4flash-onnx-memory-cama-v1", "nebius-dsv4flash-onnx-memory-cama-v2", "nebius-dsv4flash-onnx-memory-cama-epoch3-v1", "nebius-dsv4flash-onnx-memory-cama-epoch3-v2", "nebius-dsv4flash-onnx-memory-cama-every2-v1", "nebius-dsv4flash-onnx-memory-cama-every2-v2", "nebius-dsv4flash-onnx-memory-cama-epoch3-every2-v1", "nebius-dsv4flash-onnx-memory-cama-epoch3-every2-v2"]
columns = ["run", "mode", "recall", "hot", "prompt", "cached_share", "cost", "cost_cold"]
reproduce = "docker compose exec -T -e CAMA_LLM=openai_compat -e CAMA_MODEL=deepseek-ai/DeepSeek-V4-Flash-0731 -e CAMA_OAI_BASE_URL=https://api.tokenfactory.nebius.com/v1 -e CAMA_OAI_KEY_ENV=NEBIUS_API_KEY -e CAMA_OAI_SALT=<run id> [-e CAMA_WINDOW_EPOCH=3] [-e CAMA_EXTRACT_EVERY=2] cama cama run /scenarios/memory_fr_v1.jsonl --fresh --mode <cama|topk|naive> --run-id <run id>"
reading = [
  "naive recalled 13 of 13 facts in both runs and was the cheapest and fastest arm: over 32 turns the full history is short, append-only and mostly cached.",
  "topk recalled 10 and 8 of 13: per-query selection left out blocks the probes needed. cama recalled 12 or 13.",
  "Every cama miss is the same probe (turn 26): the talk length went from 30 to 25 and back to 30; the extractor can only append, judged 30 already present, and the block ended with the stale 25 as its latest line.",
  "H1 (window epoch 3) sent more prompt tokens without a higher cached share: no measured gain.",
  "H2 (extraction every two turns) gave the two lowest cold path costs of the cama variants with the same recall; two runs per arm do not settle it.",
]
limits = [
  "Two runs per arm, one synthetic French scenario of 32 turns, one model; recall is a substring check of 13 planted facts, not overall answer quality.",
  "Extraction calls are priced with their cached tokens (fixed on 2026-10-24); earlier figures price them as uncached.",
  "Short session: naive's history never grew large here, so this says nothing about long sessions.",
]

